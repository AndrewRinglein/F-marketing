function legalNotes(){return `<div class="legal"><h3>Staffing: review the source of funds and the role.</h3><p>California Penal Code §326.5(b) and (h) restrict wages from bingo and require member operation, with a security-personnel exception. Genuinely separate, non-bingo funds may be an avenue for counsel to assess; they are not blanket permission to compensate bingo workers. ${link('https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PEN&sectionNum=326.5.','Read the current statute')}.</p><p class="top-gap">In <i>Live and Learn v. City of Los Angeles</i> (1986), the court rejected paying employees with bingo proceeds even for non-bingo charitable work. That ruling does not itself approve every outside-funded staffing arrangement. Ask counsel to review duties, membership, funding restrictions, labor rules, and local permit conditions. Document separate accounts and time records; relabeling bingo receipts does not change their source. ${link('https://caselaw.findlaw.com/court/ca-court-of-appeal/1843332.html','Read the decision')}.</p><p class="top-gap"><strong>A reported example to investigate:</strong> Redwood City Pulse reported in September 2023 that Vanguard paid bingo workers from non-bingo donations and that its attorney described Santa Clara police-chief approval. This is a concrete arrangement for counsel to investigate. It is a reported local practice, not a statewide court ruling or a verified approval for your hall. Request the underlying arrangement and local written guidance before adopting it. ${link('https://www.rwcpulse.com/express-newsletter-content/2023/09/21/bingo-to-start-again-at-redwood-citys-american-legion-post-105/','Read the reported example')}.</p><h3>Hot ball: the exact game matters.</h3><p>The current §326.5(n) limit is $500 in total prizes per separate game. The Attorney General’s 1999 power-ball opinion rejected a bonus pool that exceeded the then-$250 limit. A separate pool did not avoid the cap. Review base prize plus bonus, funding, carryovers, and local rules before advertising a hot ball. This is an option to evaluate, not a pre-approved game. ${link('https://oag.ca.gov/system/files/opinions/pdfs/98-1202.pdf','Read Opinion 98-1202')}.</p><h3>Must-go: publish the exact award conditions.</h3><p>A must-go label describes an award commitment; it does not create a separate exemption from prize or permit rules. Specify the game, session, amount, qualification, pattern, tie handling, and conditions for awarding the prize. Review the total payout and funding under the applicable rules. A historic drawing advertisement is not proof of approval for a new bingo format.</p><h3>Text messages: permission first, measurement second.</h3><p>Use an explicit, optional marketing opt-in with the hall’s identity, expected frequency, message/data-rate notice, terms and privacy links, and a clear opt-out. Retain consent evidence; honor STOP and other reasonable revocations. Check current provider and legal requirements, including whether the provider permits this bingo campaign. Never buy a phone list or treat a purchase as consent. ${link('https://www.fcc.gov/consumers/guides/stop-unwanted-robocalls-and-texts','FCC guidance')}.</p><p class="small top-gap">These notes flag review items for California charitable bingo. Local authorities regulate these games; they are not a legal opinion or tribal-gaming guidance. ${link('https://www.cgcc.ca.gov/default.aspx?pageID=bingo','California Gambling Control Commission')}.</p></div>`;}

rce,'Scale evidence')}</p><ul class="sources">${p.extraSources.map(s=>`<li>${link(s[1],s[0])}</li>`).join('')}<li>${link(h.source,'Hall’s public bingo website')}</li><li>${link('https://frontiergamingsystems.com/','Frontier Gaming Systems')}</li></ul></section></div></main><footer class="footer rule"><div class="wrap row"><span>Prepared by Frontier Gaming Systems · Independent proposal</span><a href="#/${h.id}">Back to website concept</a></div></footer></div>`;}

function pageURL(id,plan=false){const base=publicBase();if(!base)return '';if(FOLDER_EDITION){const url=new URL(base);url.pathname=url.pathname.replace(/index\.html$/,'');if(!url.pathname.endsWith('/'))url.pathname+='/';return `${url.href}${id}/${plan?'plan':'index'}.html`;}return `${base}#/${id}${plan?'/plan':''}`;}
function emailContent(h){
 const demo=pageURL(h.id),plan=pageURL(h.id,true);
 const demoLink=demo?`<a href="${esc(demo)}" style="color:#176346;font-weight:bold">Open your new bingo website</a>`:'<strong>[Website link fills in after deployment]</strong>';
 const planLink=plan?`<a href="${esc(plan)}">Read the short plan and website findings</a>`:'<strong>[Detailed plan link fills in after deployment]</strong>';
 const intro={
  'hawaiian-gardens':`<p>Hi Bingo Club team,</p><p>I’m with Frontier Gaming Systems. I built a website for Hawaiian Gardens showing a practical path to becoming a top bingo destination in Southern California: give players a reason to come, let them buy ahead, and make it easy to come back.</p>`,
  'mcalister':`<p>Hi McAlister development team,</p><p>I’m with Frontier Gaming Systems. I built a bingo website concept for McAlister with one goal: turn more visits into dependable net revenue for your treatment and recovery programs. Please include your bingo manager if they’re the best person to review it.</p>`,
  'bosco':`<p>Hi Dany,</p><p>I saw that you manage Bosco Bingo. I’m with Frontier Gaming Systems, and I built a new bingo website showing how to make Saturday easier for your team while giving players more reasons to buy ahead and return.</p>`
 }[h.id];
 const findings={
  'hawaiian-gardens':'On the public pages I reviewed, I couldn’t find a text signup, loyalty explanation, or presale checkout. If those already exist, making them prominent on the website would be a quick win.',
  'mcalister':'Your bingo page publishes the schedule and explains the mission. I couldn’t find a bingo text signup, loyalty explanation, or presale checkout there.',
  'bosco':'You already offer BingoMeNow presales. I couldn’t find bingo-specific text signup or loyalty details on the reviewed page, so I’d build on the ordering system you already use.'
 }[h.id];
 const bullets={
  'hawaiian-gardens':[
   ['Collect opt-in text contacts on the website.','Make session reminders and game updates easy to sign up for.'],
   ['Enroll players in loyalty.','Give regulars a simple visit-based benefit and track who comes back.'],
   ['Offer presales.','Let players choose their session and pack, see the full price, and pay ahead.'],
   ['Put hot ball and must-go up front.','Show the amount, session, entry conditions, and current rules in one place.']],
  'mcalister':[
   ['Start with opt-in text signup.','Let players choose Friday, Saturday, or Sunday reminders.'],
   ['Add a simple loyalty program.','Measure repeat visits and reward cost using bingo-only customer records.'],
   ['Introduce presales.','Let a website visitor choose a session and buy a pack while they’re interested.'],
   ['Make featured games visible.','Use clear hot-ball and must-go details, then measure what each session contributes after costs.']],
  'bosco':[
   ['Collect opt-in text contacts beside presales.','Send a useful reminder before Friday’s online-order cutoff.'],
   ['Make loyalty easy to join.','Recognize returning players with a simple, measurable program.'],
   ['Build on BingoMeNow presales.','Keep buying ahead prominent and make preorder pickup one clear handoff.'],
   ['Show hot ball and must-go clearly.','Keep amounts, session dates, and entry conditions current so the team answers fewer repeated questions.']]
 }[h.id];
 const goal=h.id==='hawaiian-gardens'?'<p><strong>Illustrative six-month goal:</strong> 42% more attendance—for example, 100 weekly visits becoming 142. This is a planning target to test against your baseline, not a measured Frontier result.</p>':'';
 const close={
  'hawaiian-gardens':'Would you be open to a 15-minute look at the website and one small presale-and-texting pilot?',
  'mcalister':'Would you be open to choosing one small pilot and measuring the extra net funds it produces for your programs?',
  'bosco':'Would a 15-minute walkthrough of your presale-to-pickup process be useful? We’d first confirm what your existing tools can share.'
 }[h.id];
 return `${intro}<p>${demoLink}</p><p style="font-size:14px;color:#596760">Try the presale, text signup, and loyalty flows. Sample promotions and demo transactions illustrate the recommendations.</p><p>${findings}</p><ul>${bullets.map(b=>`<li style="margin-bottom:10px"><strong>${b[0]}</strong> ${b[1]}</li>`).join('')}</ul>${goal}<p>The deeper plan also covers a less obvious staffing option: using genuinely separate non-bingo funds for approved paid roles, with the arrangement reviewed against local requirements.</p><p>Frontier can help with presales, player tracking, texting, loyalty, marketing, and session reporting. ${close}</p><p>${planLink}</p><p>Best,<br>${esc(settings.sender)}<br>Frontier Gaming Systems<br><a href="https://frontiergamingsystems.com/">frontiergamingsystems.com</a><br><a href="mailto:${esc(validEmail(settings.email)?settings.email:'info@frontiergamingsystems.com')}">${esc(settings.email)}</a> · (814) 822-4646</p><p style="font-size:12px;color:#637069;line-height:1.5">Business introduction / advertisement from Frontier Gaming Systems.<br>${settings.postal.trim()?esc(settings.postal).replace(/\n/g,'<br>'):'[Add Frontier’s valid postal address before sending]'}<br>Prefer no further outreach? Reply “no thanks” and we’ll stop.</p>`;
}

function validEmail(value){return /^[^\s<>@]+@[^\s<>@]+\.[^\s<>@]+$/.test(value);}
function richEmail(h){return `<div style="font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;color:#26302d;max-width:680px">${emailContent(h)}</div>`;}
function plainEmail(h){const el=document.createElement('div');el.innerHTML=emailContent(h);el.querySelectorAll('a').forEach(a=>{a.textContent=`${a.textContent} (${a.getAttribute('href')})`;});el.querySelectorAll('li').forEach(li=>{li.insertAdjacentText('afterbegin','• ');li.insertAdjacentText('beforeend','\n');});el.querySelectorAll('br').forEach(br=>br.replaceWith('\n'));el.querySelectorAll('p,ul').forEach(p=>p.insertAdjacentText('beforeend','\n\n'));return el.textContent.replace(/\n{3,}/g,'\n\n').trim();}
function readyIssues(){return [...(!publicBase()?['Add the published website URL.']:[]),...(!settings.postal.trim()?['Add Frontier’s valid postal address.']:[]),...(!validEmail(settings.email)?['Enter a valid sender email.']:[])];}
function recipient(h){return h.id==='hawaiian-gardens'?settings.recipientHG.trim():h.email;}
function readiness(){const issues=readyIssues();return issues.length?`<div class="warning">Before sending: ${issues.map(esc).join(' ')}</div>`:'<div class="note">Links and sender details are filled in. Confirm the recipient, review the message, and send from your own email account.</div>';}
function outreach(){return `<div class="hub">${hubNav()}<main id="main" tabindex="-1"><section class="hub-header"><div class="wrap"><div class="eyebrow">Outreach workshop</div><h1>Three angles.<br>Ready to make your own.</h1><p class="muted">Copy the formatted email into Gmail or Outlook. Links update from your published URL. Nothing is sent by this dashboard.</p></div></section><div class="wrap email-layout"><aside class="settings"><h2>Sender & links</h2><p class="small muted">Saved only in this browser. The published pack itself is public; do not add confidential information to its source.</p><div class="settings-fields"><div><label for="base">Published site URL</label><input id="base" name="base" type="url" placeholder="https://yourname.github.io/bingo/" value="${esc(settings.base)}"><p class="small muted">Use the Pages site address, not the GitHub repository URL. Leave blank when viewing the published site.</p></div><div><label for="sender">Sender name</label><input id="sender" name="sender" value="${esc(settings.sender)}"><label for="email">Sender email</label><input id="email" name="email" type="email" value="${esc(settings.email)}"></div><div><label for="postal">Frontier postal address</label><textarea id="postal" name="postal" placeholder="Valid street address or registered business mailbox">${esc(settings.postal)}</textarea><p class="small muted">Required for commercial outreach. ${link('https://www.ftc.gov/business-guidance/resources/can-spam-act-compliance-guide-business','FTC guidance')}</p></div><div><label for="recipientHG">Hawaiian Gardens email</label><input id="recipientHG" name="recipientHG" type="email" value="${esc(settings.recipientHG)}" placeholder="Not yet publicly verified"><p class="small muted">Call 562-402-6769 to obtain the manager’s business address. No guessed email is supplied.</p></div></div><button class="button spaced" id="save-settings">Update emails</button><div id="readiness">${readiness()}</div><a class="small" href="#/deploy">Deployment instructions</a></aside><div><p class="note" style="margin-bottom:24px">This is a three-prospect message test, not a statistically meaningful A/B/C experiment: each angle goes to a different hall. Track replies and meetings; don’t infer a winning angle from three sends.</p>${HALLS.map(h=>`<article class="email-card" id="email-${h.id}"><div class="eyebrow">Email ${h.letter} · ${esc(h.angle)}</div><h2 class="top-gap">${esc(h.short)}</h2><p class="small muted top-gap">${esc(h.contact)} ${link(h.contactSource,'Source')}</p><p class="small top-gap" id="recipient-${h.id}"><strong>To:</strong> ${esc(recipient(h)||"Awaiting verified recipient email")}</p><div class="subject"><strong>Subject:</strong> ${esc(h.subject)}</div><div class="email-preview" id="body-${h.id}">${richEmail(h)}</div><div class="email-actions"><button class="button" data-action="copy-rich" data-hall="${h.id}">Copy formatted email</button><button class="button outline" data-action="copy-text" data-hall="${h.id}">Copy plain text</button><button class="button outline" data-action="copy-subject" data-hall="${h.id}">Copy subject</button><button class="button outline" data-action="download-email" data-hall="${h.id}">Download HTML email</button><a class="button outline" href="#/${h.id}">Website</a><a class="button outline" href="#/${h.id}/plan">Full plan</a></div><div id="fallback-${h.id}"></div></article>`).join('')}</div></div></main></div>`;}
function bindSettings(){document.getElementById('save-settings').addEventListener('click',()=>{for(const key of Object.keys(settings))settings[key]=document.getElementById(key).value.trim();try{localStorage.setItem('frontier-bingo-outreach-v1',JSON.stringify(settings));}catch{}for(const h of HALLS){document.getElementById(`body-${h.id}`).innerHTML=richEmail(h);document.getElementById(`recipient-${h.id}`).innerHTML=`<strong>To:</strong> ${esc(recipient(h)||"Awaiting verified recipient email")}`;}document.getElementById('readiness').innerHTML=readiness();toast('Email previews updated.');});}
async function copyText(text){await navigator.clipboard.writeText(text);}
function download(name,type,content){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',async event=>{
 const button=event.target.closest('[data-action]');if(!button)return;
 const h=HALLS.find(h=>h.id===button.dataset.hall);if(!h)return;
 const action=button.dataset.action;
 if(action==='copy-link'){const url=pageURL(h.id);if(!url){toast('Add the published URL in the email workshop first.');return;}try{await copyText(url);toast('Website link copied.');}catch{toast(url);}return;}
 if(action==='copy-subject'){try{await copyText(h.subject);toast('Subject copied.');}catch{toast('Select the subject text above and copy it.');}return;}
 const issues=readyIssues();if(issues.length){toast(issues.join(' '));document.getElementById('readiness')?.scrollIntoView({block:'center'});return;}
 try{
  if(action==='copy-rich'){
   if(!window.ClipboardItem||!navigator.clipboard?.write)throw new Error('Rich clipboard unavailable');
   await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([richEmail(h)],{type:'text/html'}),'text/plain':new Blob([plainEmail(h)],{type:'text/plain'})})]);toast('Formatted email copied. Paste into your email composer.');
  }else if(action==='copy-text'){await copyText(plainEmail(h));toast('Plain-text email copied, including full links.');}
  else if(action==='download-email'){download(`${h.id}-email.html`,'text/html;charset=utf-8',`<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(h.subject)}</title><body>${richEmail(h)}</body></html>`);toast('HTML email downloaded. Open it and copy the formatted body.');}
 }catch{
  const fallback=document.getElementById(`fallback-${h.id}`);fallback.innerHTML='<p class="small spaced">Clipboard access is unavailable. Select and copy the formatted preview above, or use this plain-text fallback:</p><textarea class="export-fallback" aria-label="Email text to copy"></textarea>';const area=fallback.querySelector('textarea');area.value=plainEmail(h);area.focus();area.select();toast('Use Ctrl+C (or Command+C) to copy the selected text.');
 }
});
function deployment(){return `<div class="hub">${hubNav()}<main id="main" class="wrap narrow section guide" tabindex="-1"><div class="eyebrow">One upload. Separate links.</div><h1 class="spaced">Put the pack<br>on GitHub Pages.</h1><ol class="spaced"><li>Create or open the repository you want to use.</li><li>Upload the contents of this folder into the repository’s top level: <code>index.html</code> plus the three hall folders. The dashboard links to each hall’s own <code>index.html</code> and <code>plan.html</code>.</li><li>In the repository, open <strong>Settings → Pages</strong>. Under Build and deployment, choose <strong>Deploy from a branch</strong>, select your uploaded branch and <strong>/(root)</strong>, then Save.</li><li>When GitHub shows the published Pages address, open it. The dashboard is the landing page. Copy each hall’s direct link below, or paste that published address into the email workshop.</li><li>Add your sender details and valid postal address in the <a href="#/outreach">email workshop</a>, then copy each formatted email into your own email app.</li></ol><p class="small muted">${link('https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site','GitHub’s publishing-source instructions')}. Each hall and plan uses an ordinary HTML path. Only the dashboard’s workshop uses hash navigation. No build command or routing configuration is needed.</p><section class="section"><h2>Your hall links</h2><div class="link-list spaced">${HALLS.map(h=>`<div class="card"><strong>${esc(h.short)}</strong><p>${pageURL(h.id)?`<a href="${esc(pageURL(h.id))}" target="_blank" rel="noopener noreferrer">${esc(pageURL(h.id))}</a>`:`<code>YOUR-PAGES-URL/${h.id}/index.html</code>`}</p><p class="small">Plan: <code>${pageURL(h.id,true)?esc(pageURL(h.id,true)):`YOUR-PAGES-URL/${h.id}/plan.html`}</code></p><button class="button outline spaced" data-action="copy-link" data-hall="${h.id}">Copy website link</button></div>`).join('')}</div></section><section><h2>Before you send</h2><p class="spaced">Bosco has a published named contact. McAlister has a published development inbox, which should route the message to the bingo manager. Hawaiian Gardens still needs a verified email; its phone and a foundation contact form are in the dashboard.</p><p>The websites are ready to host as interactive proposals. Players can try demo presales, text signup, and loyalty enrollment, with sample hot-ball and must-go promotions. They do not create real purchases or accounts. Bosco also links to its existing ordering provider. Live services need operator approval and integration setup.</p><p>The dashboard and all source content become public when deployed. It contains public research, not confidential sales notes. Browser settings stay on the device and do not sync to GitHub.</p></section><p class="spaced"><a class="button" href="#/outreach">Open email workshop</a></p></main></div>`;}

// Enrich the landing page into the requested prospect dashboard.

function hub(){return `<div class="hub">${hubNav()}<main id="main" tabindex="-1"><section class="hub-header"><div class="wrap"><div class="eyebrow">Frontier Gaming Systems · Outreach dashboard</div><h1>Here’s the pitch.<br><span class="serif">Here’s their new website.</span></h1><p class="muted">Three personalized emails, each linked to a working website proposal and a deeper plan. Review what they’ll receive, then copy it into your email app.</p><div class="row spaced"><a class="button" href="#/outreach">Review & copy the emails</a><a class="button outline" href="#/deploy">Get the public website links</a></div><div class="delivery-strip"><div><strong>01 · Email</strong><span class="small muted">Personal opening, practical suggestions, one clear next step.</span></div><div><strong>02 · Website</strong><span class="small muted">Presales, hot ball, must-go, text signup, and loyalty demos.</span></div><div><strong>03 · Deeper plan</strong><span class="small muted">Research, implementation steps, and measurable pilots.</span></div><div><strong>04 · Conversation</strong><span class="small muted">A short workflow review with Frontier.</span></div></div></div></section><section class="section"><div class="wrap"><div class="grid">${HALLS.map(h=>`<article class="prospect-card"><a class="preview-tile ${h.color}" href="#/${h.id}" style="text-decoration:none"><span class="eyebrow">${esc(h.location)}</span><h2 ${h.color==='hg'?'class="serif"':''}>${h.tile}</h2><span class="small">Open the interactive website</span></a><div class="prospect-inner"><div class="eyebrow">Email ${h.letter} · ${esc(h.angle)}</div><p><strong>${esc(h.name)}</strong></p><p class="small"><strong>To:</strong> ${esc(recipient(h)||'Recipient email still needed')}<br>${esc(h.recipient)}</p><div class="send-subject">${esc(h.subject)}</div><div class="stack spaced"><a class="button" href="#/outreach/${h.id}">Review & copy email ${h.letter}</a><a class="button outline" href="#/${h.id}">Try their website</a><div class="row"><a class="text-link" href="#/${h.id}/plan">Read their plan</a><button class="button outline" data-action="copy-link" data-hall="${h.id}">Copy site link</button></div></div><details class="spaced"><summary>Hall research & contact evidence</summary><p class="small">${esc(h.size)} ${link(h.sizeSource,'Scale source')}</p><p class="small">${esc(h.contact)} ${link(h.contactSource,'Contact source')}</p>${h.id==='hawaiian-gardens'?`<p class="small">Call 562-402-6769 for the manager’s business email, or use the ${link('https://www.irvingimoskowitzfoundation.org/contact-irving-moskowitz.php','foundation contact form')}.</p>`:''}<p class="small">${link(h.source,'Existing bingo website')}</p></details></div></article>`).join('')}</div><div class="note spaced"><strong>First recommendations:</strong> visible opt-in text collection, loyalty, and presales. Bosco already has presales; its pitch improves that path. Hot-ball and must-go boards show how a real game program can become easier to discover.</div><div class="two spaced"><div class="card"><h3>What recipients will try</h3><p>Choose a session and package, review a presale, try text signup, and enroll in an example loyalty program. Demo promotions and transactions are identified in the sites. Bosco also links to its real BingoMeNow provider.</p></div><div class="card"><h3>Before sending</h3><p>Publish to GitHub Pages, enter your sender name and postal address, and confirm the recipient. Bosco and McAlister have published email contacts. Hawaiian Gardens’ email remains unverified.</p></div></div><details class="spaced"><summary>Research scope and the 42% planning example</summary><p>These are established charitable bingo prospects, not a verified ranking of Southern California’s three largest halls. Historic size figures are dated in the evidence. Findings describe the pages reviewed, not every internal process. Research date: September 10, 2026.</p><p>A 42% attendance increase over six months is an illustrative target, not a verified Frontier outcome or guarantee. The plans explain a baseline, measurement, and pilot approach.</p></details></div></section></main><footer class="footer rule"><div class="wrap row"><span>Independent sales proposals · No outreach has been sent</span><a href="https://frontiergamingsystems.com/" target="_blank" rel="noopener noreferrer">Frontier Gaming Systems</a></div></footer></div>`;}

const baseRender=render;
render=function(){baseRender();if(FOLDER_EDITION)app.querySelectorAll('a[href^="#/"]').forEach(a=>{const [id,section]=a.getAttribute('href').slice(2).split('/');if(HALLS.some(h=>h.id===id))a.setAttribute('href',`${id}/${section==='plan'?'plan':'index'}.html${section&&section!=='plan'?'#'+section:''}`);});const parts=location.hash.replace(/^#\/?/,'').split('/');if(parts[0]==='outreach'&&parts[1])document.getElementById(`email-${parts[1]}`)?.scrollIntoView();};
window.removeEventListener('hashchange',baseRender);
window.addEventListener('hashchange',render);
render();
</script>
