const app = document.getElementById('app');
const esc = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

function toast(message){document.getElementById('status').textContent=message;clearTimeout(toast.timer);toast.timer=setTimeout(()=>document.getElementById('status').textContent='',6000);}
function render(){
  const parts=location.hash.replace(/^#\/?/,'').split('/');
  const route=parts[0];
  const hall=HALLS.find(h=>h.id===route);
  if(hall&&parts[1]==='plan'){app.innerHTML=brief(hall);document.title=`${hall.short} · Improvement plan | Frontier`;}
  else if(hall){app.innerHTML=document.getElementById(hall.template).innerHTML;document.title=`${hall.short} · Website concept | Frontier`;}
  else if(route==='outreach'||route==='followups'){app.innerHTML=outreach();document.title='Bingo outreach emails | Frontier';bindSettings();}
  else if(route==='deploy'){app.innerHTML=deployment();document.title='Deploy & share | Frontier';}
  else if(!route){app.innerHTML=hub();document.title='Bingo, with a brighter future · Frontier';}
  else{app.innerHTML=`<div class="hub">${hubNav()}<main id="main" class="wrap section" tabindex="-1"><h1>That page isn’t here.</h1><p class="spaced"><a href="#/">Return to the hall dashboard</a></p></main></div>`;document.title='Page not found | Frontier';}
  mountHall();
  window.scrollTo(0,0);
  if(hall&&parts[1]&&parts[1]!=='plan'){const target=document.getElementById(parts[1]);if(target)target.scrollIntoView();}
  document.getElementById('main')?.focus({preventScroll:true});
}
document.getElementById('skip-link').addEventListener('click',event=>{event.preventDefault();const main=document.getElementById('main');main?.focus();main?.scrollIntoView();});
window.addEventListener('hashchange',render);

function legalNotes(){return `<div class="legal"><h3>Staffing: review the source of funds and the role.</h3><p>California Penal Code §326.5(b) and (h) restrict wages from bingo and require member operation, with a security-personnel exception. Genuinely separate, non-bingo funds may be an avenue for counsel to assess; they are not blanket permission to compensate bingo workers. ${link('https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PEN&sectionNum=326.5.','Read the current statute')}.</p><p class="top-gap">In <i>Live and Learn v. City of Los Angeles</i> (1986), the court rejected paying employees with bingo proceeds even for non-bingo charitable work. That ruling does not itself approve every outside-funded staffing arrangement. Ask counsel to review duties, membership, funding restrictions, labor rules, and local permit conditions. Document separate accounts and time records; relabeling bingo receipts does not change their source. ${link('https://caselaw.findlaw.com/court/ca-court-of-appeal/1843332.html','Read the decision')}.</p><p class="top-gap"><strong>A reported example to investigate:</strong> Redwood City Pulse reported in September 2023 that Vanguard paid bingo workers from non-bingo donations and that its attorney described Santa Clara police-chief approval. This is a concrete arrangement for counsel to investigate. It is a reported local practice, not a statewide court ruling or a verified approval for your hall. Request the underlying arrangement and local written guidance before adopting it. ${link('https://www.rwcpulse.com/express-newsletter-content/2023/09/21/bingo-to-start-again-at-redwood-citys-american-legion-post-105/','Read the reported example')}.</p><h3>Hot ball: the exact game matters.</h3><p>The current §326.5(n) limit is $500 in total prizes per separate game. The Attorney General’s 1999 power-ball opinion rejected a bonus pool that exceeded the then-$250 limit. A separate pool did not avoid the cap. Review base prize plus bonus, funding, carryovers, and local rules before advertising a hot ball. This is an option to evaluate, not a pre-approved game. ${link('https://oag.ca.gov/system/files/opinions/pdfs/98-1202.pdf','Read Opinion 98-1202')}.</p><h3>Must-go: publish the exact award conditions.</h3><p>A must-go label describes an award commitment; it does not create a separate exemption from prize or permit rules. Specify the game, session, amount, qualification, pattern, tie handling, and conditions for awarding the prize. Review the total payout and funding under the applicable rules. A historic drawing advertisement is not proof of approval for a new bingo format.</p><h3>Text messages: permission first, measurement second.</h3><p>Use an explicit, optional marketing opt-in with the hall’s identity, expected frequency, message/data-rate notice, terms and privacy links, and a clear opt-out. Retain consent evidence; honor STOP and other reasonable revocations. Check current provider and legal requirements, including whether the provider permits this bingo campaign. Never buy a phone list or treat a purchase as consent. ${link('https://www.fcc.gov/consumers/guides/stop-unwanted-robocalls-and-texts','FCC guidance')}.</p><p class="small top-gap">These notes flag review items for California charitable bingo. Local authorities regulate these games; they are not a legal opinion or tribal-gaming guidance. ${link('https://www.cgcc.ca.gov/default.aspx?pageID=bingo','California Gambling Control Commission')}.</p></div>`;}

ors, 6 PM warm-up games and 6:30 bingo time together so new players arrive ready."]],"close":"Which of these would make the biggest difference for Fremont Elks Bingo?"},"design":{"headline":"Thursday belongs to bingo.","lead":"Come for the games. Stay for the company. Everyone is welcome at Fremont Elks Thursday bingo.","offerTitle":"Thursday Hot Ball","offerValue":"$1,500","offerCopy":"A little more excitement for your Thursday night. Get your pack and be ready for the first call.","loyaltyName":"Thursday Regulars","loyaltyCopy":"Enroll free. Four visits earn a $4 snack-bar reward for your next bingo night.","layout":"editorial","accent":"#6a417a","background":"#f5eff8"},"variant":3,"designNotes":"Checked September 10, 2026. Use the detailed local bingo pages and September 2026 calendar rather than older elks.org listing with conflicting hours. Phone is the publicly listed bingo chair's contact. Featured hot-ball amount, new packages and rewards are proposed demo content, not verified current programs.","pricesVerified":true,"packages":[["Session Pack",30,"Your session in one convenient pack"]]},{"id":"aquamaids","name":"Aquamaids Bingo","short":"Aquamaids Bingo","city":"Santa Clara","region":"Northern California","address":"1600 Martin Avenue, Santa Clara, CA 95050","phone":"408-988-9936","email":"bingoconnect@aquamaids.org","contactName":"","contactRole":"Bingo management team · published hall inbox","source":"https://www.aquamaidsbingo.com/","contactSource":"https://www.aquamaidsbingo.com/clientlogin.asp","scheduleSource":"https://www.prnewswire.com/news-releases/aquamaids-bingo-announces-the-return-of-midnight-madness-301960646.html","days":[2,3,4,5],"schedule":[{"days":[2,3,4],"label":"Tuesday–Thursday","doors":"3:30 PM","start":"6:30 PM","extra":"Choose your evening pack"},{"days":[5],"label":"Friday","doors":"3:30 PM","start":"6:00 PM","extra":"Friday packs from $100"}],"charity":"Santa Clara Aquamaids","mission":"Your bingo night helps support artistic swimming athletes. Come for the games and help the Santa Clara Aquamaids keep moving forward.","sms":"visible","presale":"visible","loyalty":"not-visible","checkoutURL":"https://www.airmenu.com/aquamaidsbingo?cookielocalok=&locale=en","checkoutLabel":"Aquamaids reservations","checkoutLead":"Pick your evening and package here, then buy through Aquamaids’ existing reservation service.","packages":[["$50 Buy-In",50,"Entry package · game program varies by night"],["$75 Buy-In",75,"More strips and premium-game play"],["$100 Buy-In",100,"Expanded package · see your session’s program"]],"researchNotes":"User explicitly requested Aquamaids as an exception to the earlier prospect exclusion. Vanguard remains a comparison subject, not an outreach recipient. Current Aquamaids homepage lists doors 3:30 PM, while footer says 4 PM. Game starts use Aquamaids' October 2023 press release (Tuesday–Thursday 6:30 PM; Friday 6 PM), not newly verified 2026 times. Refresh for an official player launch. The $20,000 hot-ball payout and $10 add-on are listed for Wednesday and Thursday; the source does not establish a live progressive balance. Day-specific buy-in price tiers are preserved; detailed game inclusions vary. The loyalty benefit and presale pickup promise are proposed. No visible loyalty enrollment was found; that is not proof Aquamaids has no internal rewards. Aquamaids' public About, Sessions and Promotions navigation returned the same default page during review.","claimNotes":"Revenue statement supplied by Andrew for Frontier's pitch: Vanguard increased revenue by more than 50% in each of the last two years. No public financial source, exact year pair, accounting measure or causal analysis was supplied or independently verified. The statement is used as supplied, not presented as a finding from the websites. Do not assert that Aquamaids' revenue is declining or that any one tactic caused Vanguard's growth.","evidence":[{"topic":"Aquamaids already has hot ball","observed":"Wednesday and Thursday tables list a $10 hot-ball option with a $20,000 payout. Promote an existing attraction more clearly; do not pitch it as a missing game.","url":"https://www.aquamaidsbingo.com/"},{"topic":"Aquamaids already collects text signups","observed":"The homepage links to a BSeenNow text signup. A new program can build on that list and connect each message to a particular session.","url":"https://login.bseennow.net/kiosk.jsf?code=3UE7BKUJ"},{"topic":"Aquamaids already has reservations","observed":"The reservations button opens an AirMenu destination. The opportunity is a simpler path from a game offer to a dated purchase.","url":"https://www.airmenu.com/aquamaidsbingo?cookielocalok=&locale=en"},{"topic":"Vanguard promotes a complete visit","observed":"Its current bingo page connects prominent prize promotions, individual session links, reserved seats, presale incentives and arrival information.","url":"https://www.scvanguard.org/bingo/"},{"topic":"Repeat-visit promotions","observed":"Vanguard's 2025 landing page describes online-only bonuses, short-notice promotions announced by text, and birthday offers tied to a future visit. It is a historical playbook, not confirmation every offer is unchanged.","url":"https://www.scvanguard.org/bingo-new-landing-2025/"},{"topic":"Published contact","observed":"Aquamaids' account page publishes bingoconnect@aquamaids.org and the hall phone number.","url":"https://www.aquamaidsbingo.com/clientlogin.asp"}],"pitch":{"subject":"How Aquamaids can compete better with Vanguard","intro":"Vanguard has increased its revenue by more than 50% in each of the last two years. Aquamaids already has important pieces in place: hot ball, texting, and online reservations. Here are five practical ways to turn those tools into more visits and more money for your athletes.","bullets":[["Make your hot ball impossible to miss.","Your site lists a $20,000 hot-ball payout. Put the amount, the playing nights and the buy-in button together at the top. Vanguard gives its featured prizes prominent billing; Aquamaids can do the same."],["Give every text a clear next step.","You already collect text signups. Send players an offer for their preferred night with a link to buy that session. Invite regulars back when they have missed a few visits."],["Make buying ahead worth it.","Keep your reservation service, but give each night an obvious presale button and a simple package choice. Test a café benefit for advance purchases and make pickup easy."],["Give players a reason to choose you again.","Put loyalty enrollment on the website. Start with a clear reward after five visits, then add a birthday invitation and a bring-a-friend night."],["Compete on money kept, not just prizes advertised.","Track repeat visits, advance orders, staff time and what remains after prizes and costs. Build Tuesday–Thursday regulars, then test one stronger Friday offer."]],"close":"Would a stronger midweek crowd or a smoother Friday make the bigger difference for Aquamaids right now?"},"competition":[{"topic":"A prize that sells the visit","vanguard":"Featured hot-ball promotions appear high on the current page.","aquamaids":"Hot-ball information sits inside dense package tables.","move":"Lead with your $20,000 Wednesday/Thursday offer and a session button.","why":"Players see a reason to choose a night before they have to study every package."},{"topic":"Commit before leaving home","vanguard":"Separate purchase links by session, seat selection and advance-buying incentives.","aquamaids":"Reservations exist, but the homepage separates them from the package information.","move":"Put date, price, package and reservations together. Give presale customers a clear pickup path.","why":"Fewer steps make it easier to turn interest into a committed visit."},{"topic":"A text worth acting on","vanguard":"Its published promotional playbook uses texts to announce special nights.","aquamaids":"Text enrollment already exists; message content and results are not public.","move":"Link each offer to its session, let people choose nights, and follow up with regulars who have stopped coming.","why":"A useful reminder reaches the player while there is still time to make plans."},{"topic":"The next visit","vanguard":"The 2025 page describes birthday and future-visit incentives.","aquamaids":"A clear loyalty enrollment and earn-and-redeem explanation were not visible.","move":"Launch Aquamaids Club: five visits earn a $10 café credit. Show progress and invite members back.","why":"An easy-to-understand reward gives regulars a reason to make another visit."},{"topic":"Choose the right nights","vanguard":"Santa Clara's listed schedule emphasizes Friday through Monday.","aquamaids":"Aquamaids lists Tuesday through Friday.","move":"Build a dependable midweek habit and judge Friday offers by what is left after costs.","why":"You can make your schedule an advantage without trying to outspend every rival promotion."}],"actions":["This week: give the Wednesday/Thursday hot ball its own prominent panel and assign one person to update it.","Next session: send one approved text with one offer and one purchase link; count orders and visits from it.","First two weeks: test one presale café benefit and record pickup waits, redemptions and cost.","First month: enroll willing regulars in Aquamaids Club and track how many return.","Every week: review attendance and money left for the athletes, then keep or change the offer."],"pilot":"Start with Wednesday and Thursday for 30 days. Put the hot ball up front, link texts to those sessions, offer a modest presale benefit and enroll players in Aquamaids Club. Count first visits, repeat visits, advance orders and café rewards used. Compare what remains after prizes and costs with recent sessions. Use the results to shape one Friday test.","design":{"headline":"Your big night starts here.","lead":"A hot ball worth making plans for. An easy presale. A night that helps our athletes go further.","offerTitle":"Wednesday & Thursday · Hot ball","offerValue":"$20,000","offerCopy":"Hot-ball entry is $10 in addition to your buy-in. Choose your night, pick your pack and arrive ready.","loyaltyName":"Aquamaids Club","loyaltyCopy":"Make every visit count. Enroll in Aquamaids Club: five visits earn a $10 café credit.","layout":"poster","accent":"#006976","background":"#f3fbff"},"heroEyebrow":"Santa Clara · Tuesday through Friday","textHeadline":"Your night. Your offer. Your text.","textCopy":"Choose the nights you play. Get hot-ball updates, special offers and a direct link to your next session.","loyaltyHeadline":"Five visits. A little extra on us.","missionHeadline":"Big nights help athletes go further.","visitHeadline":"Meet us on Martin Avenue.","buyLabel":"Choose your night & buy-in","variant":0,"designNotes":"User explicitly requested Aquamaids as an exception to the earlier prospect exclusion. Vanguard remains a comparison subject, not an outreach recipient. Current Aquamaids homepage lists doors 3:30 PM, while footer says 4 PM. Game starts use Aquamaids' October 2023 press release (Tuesday–Thursday 6:30 PM; Friday 6 PM), not newly verified 2026 times. Refresh for an official player launch. The $20,000 hot-ball payout and $10 add-on are listed for Wednesday and Thursday; the source does not establish a live progressive balance. Day-specific buy-in price tiers are preserved; detailed game inclusions vary. The loyalty benefit and presale pickup promise are proposed. No visible loyalty enrollment was found; that is not proof Aquamaids has no internal rewards. Aquamaids' public About, Sessions and Promotions navigation returned the same default page during review.","pricesVerified":true}];
function extraHall(id){return typeof EXTRA_HALLS==='undefined'?null:EXTRA_HALLS.find(h=>h.id===id);}
function extraDateAllowed(id,d){const date=d.toISOString().slice(0,10);if(id==='russian-river-sisters'&&['2026-09-12','2026-10-10'].includes(date))return false;if(id!=='ventura-elks')return true;const m=d.getUTCMonth(),day=d.getUTCDate(),week=Math.ceil(day/7);if((m===0&&week===3)||(m===1&&week===3)||(m===4&&day>=25)||(m===8&&week===1)||(m===9&&week===2))return false;for(const [month,num] of [[0,1],[5,19],[6,4],[10,11],[11,25]])if(m===month&&(day===num||day===num+1))return false;return true;}
function registerExtraShops(){for(const h of EXTRA_HALLS){HALL_SHOP[h.id]={name:h.name,days:h.days,packages:h.packages,checkout:h.checkoutURL||'',checkoutLabel:h.checkoutLabel||'official presales',checkoutLead:h.checkoutLead||'Choose your session and pack, then continue to the hall’s ordering service.',samplePrices:!h.pricesVerified,schedule:d=>{const s=h.schedule.find(s=>s.days.includes(d))||h.schedule[0];return `Doors ${s.doors} · Bingo ${s.start}${s.extra?' · '+s.extra:''}`;},weekOrdinals:h.weekOrdinals||null,dates:h.dates||null};}}
function extraSchedule(h){return `<div class="schedule-rows">${h.schedule.map(s=>`<div class="schedule-row"><strong>${siteEsc(s.label)}</strong><span>Doors ${siteEsc(s.doors)}<br><b>Bingo ${siteEsc(s.start)}</b>${s.extra?`<small>${siteEsc(s.extra)}</small>`:''}</span></div>`).join('')}</div>`;}
function extraOffer(h){const d=h.design;return `<article class="hall-offer"><div><div class="eyebrow">${siteEsc(d.offerTitle)}</div><div class="offer-value">${siteEsc(d.offerValue)}</div></div><div><p>${siteEsc(d.offerCopy)}</p><a class="text-link spaced" style="display:inline-block" href="${hallSectionLink(h.id,'book')}">Choose your pack</a></div></article>`;}
function extraRewards(h){const d=h.design;return `<section class="section retention" id="updates"><div class="wrap two"><div class="text-panel"><div class="eyebrow">${siteEsc(h.textEyebrow||'Keep your next session close')}</div><h2 class="top-gap">${siteEsc(h.textHeadline||'Get the text. Make the date.')}</h2><p class="spaced">${siteEsc(h.textCopy||`Get ${h.short} game reminders, special-night news, and prize updates on your phone. Choose the messages you want.`)}</p><button class="button spaced" onclick="previewSignup('${h.id}')">Get text updates</button><div id="signup-${h.id}" class="top-gap" aria-live="polite"></div></div><article class="reward-card"><div class="eyebrow">${siteEsc(d.loyaltyName)}</div><h3 class="spaced">${siteEsc(h.loyaltyHeadline||'A little thank-you for coming back.')}</h3><p class="spaced">${siteEsc(d.loyaltyCopy)}</p><button class="button spaced" onclick="demoLoyalty('${h.id}')">Enroll in our loyalty program</button><div id="loyalty-${h.id}" class="top-gap" aria-live="polite"></div></article></div></section>`;}
function extraVisit(h){const map='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(h.name+' '+h.address);return `<section class="section rule" id="visit"><div class="wrap two"><div><div class="eyebrow">${siteEsc(h.city)}, California</div><h2 class="top-gap">${siteEsc(h.visitHeadline||'Your next visit starts here.')}</h2><p class="local-address spaced">${siteEsc(h.address)}</p><a class="button outline spaced" href="${siteEsc(map)}" target="_blank" rel="noopener noreferrer">Get directions</a></div><div class="arrival-panel"><h3>Arrive ready to play</h3>${extraSchedule(h)}<p class="small top-gap">All times Pacific. Buy ahead, keep your confirmation, and arrive when doors open.</p></div></div></section>`;}
function extraMission(h){return `<section class="section"><div class="wrap"><div class="mission-panel"><div class="eyebrow">${siteEsc(h.charity)}</div><h2>${siteEsc(h.missionHeadline||'A good night. A greater purpose.')}</h2><p>${siteEsc(h.mission)}</p></div></div></section>`;}
function extraModules(id){const h=extraHall(id);if(!h)return '';const booking=id==='aquamaids'?aquamaidsBooking():bookingHTML(id),rewards=extraRewards(h),offer=`<section class="section" id="games"><div class="wrap">${extraOffer(h)}</div></section>`;switch(h.design.layout){case'schedule':return offer+booking+rewards+extraMission(h)+extraVisit(h);case'impact':return extraMission(h)+booking+rewards+extraVisit(h);case'club':return rewards+booking+extraVisit(h)+extraMission(h);case'editorial':return booking+extraMission(h)+rewards+extraVisit(h);case'ticket':return booking+extraVisit(h)+rewards+extraMission(h);default:return booking+rewards+extraMission(h)+extraVisit(h);}}
function extraSiteHTML(h){const d=h.design,s=h.schedule[0],cta=`<div class="row spaced"><a class="button" href="#/${h.id}/book">${siteEsc(h.buyLabel||'Buy your pack ahead')}</a><a class="text-link" href="#/${h.id}/updates">Player rewards</a></div>`,title=`<div class="eyebrow">${siteEsc(h.heroEyebrow||h.city+' · '+s.label)}</div><h1 class="top-gap">${siteEsc(d.headline)}</h1><p class="hall-lead">${siteEsc(d.lead)}</p>${cta}`,arrivals=`<aside class="arrival-panel"><div class="eyebrow">Pick your time</div><h3 class="top-gap">${siteEsc(h.scheduleHeadline||'Your next bingo date.')}</h3>${extraSchedule(h)}</aside>`;let hero;
 if(d.layout==='impact')hero=`<div>${title}</div><div class="impact-band">${extraOffer(h)}${arrivals}</div>`;

function competitionHTML(r){return `<section class="competition-section"><div class="eyebrow">Aquamaids and Vanguard · A practical comparison</div><h2 class="top-gap">Compete for the next visit.</h2><p class="spaced">Vanguard has increased its revenue by more than 50% in each of the last two years. The public-facing practices below offer useful lessons for Aquamaids. They show what to test; the websites do not tell us how much growth each practice produced.</p><div class="comparison-scroll spaced"><table class="competition-table"><thead><tr><th scope="col">Opportunity</th><th scope="col">Vanguard’s approach</th><th scope="col">Aquamaids today</th></tr></thead><tbody>${r.competition.map(row=>`<tr><th scope="row">${esc(row.topic)}</th><td>${esc(row.vanguard)}</td><td>${esc(row.aquamaids)}</td></tr>`).join('')}</tbody></table></div><p class="small top-gap">Sources: ${link('https://www.scvanguard.org/bingo/','Vanguard’s current page')}, ${link('https://www.scvanguard.org/bingo-new-landing-2025/','Vanguard’s 2025 promotional page')}, ${link(r.source,'Aquamaids’ current page')}.</p><h3 class="spaced">Why these changes can help</h3>${r.competition.map(row=>`<div class="spaced"><strong>${esc(row.move)}</strong><p class="top-gap">${esc(row.why)}</p></div>`).join('')}<p class="spaced">Aquamaids already has the core tools. The next step is to make the offer easier to see, the purchase easier to complete, and the next visit easier to earn.</p></section>`;}
function aquamaidsPacks(day){const prices=day===5?[100,150]:day===2?[50,75,100,150]:[50,75,100];return prices.map(price=>[`$${price} Buy-In`,price,price===50?'Entry package · regular strips and paper games':'Expanded strip package · game lineup varies by session']);}
function aquamaidsBooking(){const id='aquamaids',sessions=nextSessions(id),day=new Date(sessions[0].value+'T12:00:00Z').getUTCDay();HALL_SHOP[id].packages=aquamaidsPacks(day);return bookingHTML(id).replace('id="session-aquamaids" onchange="updateShop(\'aquamaids\')"','id="session-aquamaids" onchange="updateAquamaidsSession()"').replace('<div class="package-options">','<div class="package-options" id="aquamaids-pack-options">');}
function updateAquamaidsSession(){const id='aquamaids',date=document.getElementById('session-aquamaids').value;HALL_SHOP[id].packages=aquamaidsPacks(new Date(date+'T12:00:00Z').getUTCDay());document.getElementById('aquamaids-pack-options').innerHTML=HALL_SHOP[id].packages.map((p,i)=>`<label class="package-choice"><input type="radio" name="package-aquamaids" value="${i}" ${i===0?'checked':''} onchange="updateShop('aquamaids')"><span><strong>${siteEsc(p[0])} <b>$${p[1]}</b></strong><small>${siteEsc(p[2])}</small></span></label>`).join('');updateShop(id);}

function extraEmailContent(h){const r=h.extra,p=r.pitch;return `<p>Hi ${esc(r.contactName||r.short+' team')},</p><p>${esc(p.intro)}</p><ul>${p.bullets.map(b=>`<li style="margin-bottom:12px"><strong>${esc(b[0])}</strong> ${esc(b[1])}</li>`).join('')}</ul><p><strong>We put those ideas into a new website for ${esc(r.short)}:</strong><br><a href="${esc(pageURL(h.id))}">Open your new bingo website</a></p><p>Try the presale flow, text signup, and loyalty program. <a href="${esc(pageURL(h.id,true))}">Here’s the short plan with the website findings and next steps.</a></p><p>${esc(p.close)}</p><p>We’re Frontier Gaming Systems. We help bingo halls bring players back, make busy nights easier to run, and keep more money for their cause—with presales, texting, loyalty, and simpler daily operations.</p><p>Best,<br>${esc(settings.sender)}<br>Frontier Gaming Systems<br><a href="https://frontiergamingsystems.com/">frontiergamingsystems.com</a><br><a href="mailto:${esc(settings.email)}">${esc(settings.email)}</a> · (814) 822-4646</p><p style="font-size:12px;color:#637069">Business introduction / advertisement from Frontier Gaming Systems.<br>${settings.postal.trim()?esc(settings.postal).replace(/\n/g,'<br>'):'[Add Frontier’s valid postal address before sending]'}<br>Prefer no further outreach? Reply “no thanks” and we’ll stop.</p>`;}
function extraBrief(h){const r=h.extra;return `<div class="brief">${hubNav()}<main id="main" tabindex="-1"><header class="brief-header"><div class="wrap"><div class="eyebrow">${esc(h.short)} · Your growth plan</div><h1>${esc(r.pitch.subject)}</h1><p>${esc(r.pitch.intro)}</p><div class="row"><a class="button light" href="#/${h.id}">Explore your new website</a><a class="button ghost" href="https://frontiergamingsystems.com/contact.html" target="_blank" rel="noopener noreferrer">Talk with us</a></div></div></header><div class="wrap narrow brief-content">${r.competition?competitionHTML(r):''}<section><div class="eyebrow">Website review · September 10, 2026</div><h2 class="top-gap">Start with what you have.</h2><div class="research-table">${r.evidence.map(e=>`<div class="research-row"><div><b>${esc(e.topic)}</b><p>${esc(e.observed)} ${link(e.url,'Source')}</p></div></div>`).join('')}</div><p class="small muted spaced">These findings describe the public pages we reviewed. A feature that wasn’t visible may already exist in your hall; if it does, bring it forward on the website.</p></section><section><h2>${r.pitch.bullets.length===5?'Five':'Four'} practical improvements.</h2>${r.pitch.bullets.map((b,i)=>`<article class="recommendation"><span class="index">0${i+1}</span><div><h3>${esc(b[0])}</h3><p>${esc(b[1])}</p><p class="metric">${esc(r.actions?.[i]||['First step: put the signup or offer beside the session players are choosing.','First step: choose one easy benefit and explain how players earn it.','First step: try this with one session and compare attendance and staff time.','First step: give one person ownership and review the results each week.'][i])}</p></div></article>`).join('')}</section><section><h2>What Frontier can do for you.</h2>${frontierFit()}</section><section><h2>Start small. See what improves.</h2><p>${esc(r.pilot||`Pick one recurring ${r.short} session for the first month. Count players, repeat visits, advance purchases, and how long check-in takes. Compare the money left after prizes and costs. Keep what works, then add the next session.`)}</p></section><section><h2>Your website, ready for the next step.</h2><p>The design puts your session times, presales, text signup, and loyalty enrollment in one place. Its ${esc(r.design.offerTitle.toLowerCase())} offer gives players a clear reason to make plans.</p><details class="spaced"><summary>Website setup notes</summary><p>${esc(r.designNotes||'This proposal includes suggested promotional amounts, package choices, and loyalty benefits. They demonstrate the experience we can build together; your hall sets the live offers and game rules.')} The interactive previews do not create purchases, text subscriptions, or loyalty accounts. ${r.checkoutURL?'Your published ordering link is also available for existing presales.':''} Before launch, connect payments and messaging, set pickup and refund rules, and approve the final timetable and offers.</p></details></section><section><h2>Staffing and game details.</h2><p>You may be able to pay staff using funds your charity raises outside bingo. We can help organize the operational records while your adviser checks the funding arrangement and local requirements.</p><details class="spaced"><summary>Read the supporting guidance</summary>${legalNotes()}</details></section><section><h2>Contact and sources.</h2><p>${esc(h.contact)} ${link(h.contactSource,'Published contact')}</p><p class="top-gap">${esc(r.address)}</p><ul class="sources">${[...new Set([r.source,r.scheduleSource,r.contactSource,...r.evidence.map(e=>e.url)])].filter(Boolean).map(url=>`<li>${link(url,new URL(url).hostname+new URL(url).pathname)}</li>`).join('')}</ul></section></div></main><footer class="footer rule"><div class="wrap"><a href="#/${h.id}">Back to your website</a> · Frontier Gaming Systems</div></footer></div>`;}
function featureBadges(h){if(!h.extra)return '';const r=h.extra,label=(v)=>v==='visible'?'Visible':v==='not-visible'?'Not visible':'Review';return `<div class="feature-status"><span>Text signup: ${label(r.sms)}</span><span>Presales: ${label(r.presale)}</span><span>Loyalty: ${label(r.loyalty)}</span></div>`;}
function filterProspects(){const q=(document.getElementById('hall-search')?.value||'').toLowerCase(),region=document.getElementById('hall-region')?.value||'';let count=0;document.querySelectorAll('[data-prospect]').forEach(el=>{const h=HALLS.find(h=>h.id===el.dataset.prospect);const match=[h.name,h.location,h.extra?.charity||''].join(' ').toLowerCase().includes(q)&&(!region||(h.extra?.region||'Southern California')===region);el.hidden=!match;if(match)count++;});const el=document.getElementById('hall-result-count');if(el)el.textContent=`${count} halls shown`;}

function competitionEmail(h){
 const s=COMPETITION_SUMMARIES[h.id],names=s.names.slice(0,2).join(' and '),op=s.opportunities;
 const intro=names?`Players near ${esc(h.location)} have choices, including ${esc(names)}. What would make them choose ${esc(h.short)} for their next bingo night?`:`What would make more players around ${esc(h.location)} choose ${esc(h.short)} for their next bingo night?`;
 const angle=HALLS.findIndex(x=>x.id===h.id)%3;
 const openings=["Here's a local competition review to help you see what nearby halls offer and where you can stand out.","A fuller room can mean more money for your cause. This local competition review shows what nearby halls put in front of players when they are choosing where to go.","Winning more visits doesn't have to mean more work for your crew. This local competition review helps you spot improvements that make choosing your hall—and arriving ready to play—easier."];
 return `<p>Hello ${esc(h.extra?.contactName||(h.id==='bosco'?'Dany':h.short+' team'))},</p><p>${intro}</p><p>${openings[angle]}</p><p><a href="${esc(competitionURL(h.id))}" style="display:inline-block;background:#153f35;color:#ffffff;text-decoration:none;padding:12px 18px;border-radius:6px;font-weight:bold">Want to see how you stack up?</a></p><p>The map starts at your hall. Click nearby halls to see their published game days, buy-ins, offers, text alerts, advance ordering and rewards. There's also a <a href="${esc(competitionURL(h.id,true))}">hall-by-hall comparison</a>.</p><p><strong>Three things worth trying:</strong></p><ul>${op.map(o=>`<li><strong>${esc(o.title)}</strong> ${esc(o.text)}</li>`).join('')}</ul><p>When you promote a hot ball or must-go, put the amount beside the game date and presale button. Give players a clear reason to choose that session.</p><p>Here's <a href="${esc(pageURL(h.id))}">the website we put together for ${esc(h.short)}</a>, with a simpler path from interest to a visit.</p><p>We can help you put these ideas to work with presales, texting, loyalty and easier daily operations—so more of each night's revenue stays with your cause.</p><p>Which nearby hall do you hear your players talking about most?</p><p>${esc(settings.sender)}<br>Frontier Gaming Systems<br><a href="mailto:${esc(settings.email)}">${esc(settings.email)}</a><br><a href="https://frontiergamingsystems.com/">frontiergamingsystems.com</a>${settings.postal?'<br>'+esc(settings.postal).replace(/\n/g,'<br>'):''}</p><p style="font-size:12px;color:#61716b">If you would prefer no more emails from us, reply “no thanks.”</p>`;
}

 const intro={
  'hawaiian-gardens':`<p>Hi Bingo Club team,</p><p>Here are a few practical ways to make Hawaiian Gardens a top bingo destination in Southern California: make buying ahead easy, give players a reason to return, and keep your best games in front of them.</p>`,

 }[h.id];

  'hawaiian-gardens':'Your public pages don’t make text signup, loyalty, or presales easy to find. If you already offer them, simply bringing them onto the main page is a useful first step.',
  'mcalister':'Your bingo page makes the schedule and mission clear. Text signup, loyalty, and presales weren’t visible on that page—three opportunities to turn more interest into repeat visits.',
  'bosco':'You already offer BingoMeNow presales, so there’s a foundation to build on. Text signup and loyalty details weren’t visible on the bingo page reviewed.'
 }[h.id];
 const bullets={
  'hawaiian-gardens':[
   ['Get players signed up for texts.','Put a signup on your website so players can choose to receive reminders and game updates.'],
   ['Give regulars a reason to come back.','Offer a simple loyalty reward and keep track of return visits.'],
   ['Let players buy before game night.','Presales alone have increased attendance by 42% over six months in our work with bingo halls. Give players a reason to commit now, then send a reminder before they come.'],
   ['Put hot ball and must-go up front.','Show the prize, when it plays, and what players need to buy to take part.']],
  'mcalister':[
   ['Get players signed up for texts.','Let them choose Friday, Saturday, or Sunday reminders right on your website.'],
   ['Reward the players who come back.','Start with a simple loyalty program and watch how often members return.'],
   ['Let players buy their packs ahead of time.','Presales alone have increased attendance by 42% over six months in our work with bingo halls. Let players choose a day and pay while they’re already on your website.'],
   ['Give players a reason to pick your hall.','Show your hot-ball and must-go prizes clearly. Keep track of what’s left for your programs after prizes and costs.']],
  'bosco':[
   ['Get players signed up for texts.','Put signup beside online buying, then remind them before sales close on Friday.'],
   ['Make loyalty easy to join.','Give regulars a simple reward for coming back.'],
   ['Make more of your existing presales.','Keep the buy-ahead button easy to find and give those players a clear place to pick up their packs.'],
   ['Show hot ball and must-go clearly.','Post the prizes, game times, and what’s included so your team answers fewer of the same questions.']]
 }[h.id];
 const close={
  'hawaiian-gardens':'Which of these would make the biggest difference for your hall?',
  'mcalister':'Which of these would be most useful for your bingo team right now?',
  'bosco':'Where does your team spend the most time on Saturdays: presales, pickup, floor sales, or closing?'
 }[h.id];
 return `${intro}<ul>${bullets.map(b=>`<li style="margin-bottom:10px"><strong>${b[0]}</strong> ${b[1]}</li>`).join('')}</ul><p>${findings}</p><p><strong>Here’s a website showing what that could look like for your hall:</strong><br>${demoLink}</p><p style="font-size:14px;color:#596760">Try buying a pack, signing up for texts, and joining the loyalty program.</p><p>You may also have options to pay staff with money your charity raises outside bingo. The short plan explains an example and what to check with your adviser.</p><p>${planLink}</p><p>${close}</p><p>If useful, Frontier Gaming Systems can help set up presales, texting, loyalty, and simple reports showing who comes back and what each night earns.</p><p>Best,<br>${esc(settings.sender)}<br>Frontier Gaming Systems<br><a href="https://frontiergamingsystems.com/">frontiergamingsystems.com</a><br><a href="mailto:${esc(validEmail(settings.email)?settings.email:'info@frontiergamingsystems.com')}">${esc(settings.email)}</a> · (814) 822-4646</p><p style="font-size:12px;color:#637069;line-height:1.5">Business introduction / advertisement from Frontier Gaming Systems.<br>${settings.postal.trim()?esc(settings.postal).replace(/\n/g,'<br>'):'[Add Frontier’s valid postal address before sending]'}<br>Prefer no further outreach? Reply “no thanks” and we’ll stop.</p>`;
}

function validEmail(value){return /^[^\s<>@]+@[^\s<>@]+\.[^\s<>@]+$/.test(value);}
function richEmail(h){return `<div style="font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;color:#26302d;max-width:680px">${emailContent(h)}</div>`;}
function plainEmail(h){const el=document.createElement('div');el.innerHTML=emailContent(h);el.querySelectorAll('a').forEach(a=>{a.textContent=`${a.textContent} (${a.getAttribute('href')})`;});el.querySelectorAll('li').forEach(li=>{li.insertAdjacentText('afterbegin','• ');li.insertAdjacentText('beforeend','\n');});el.querySelectorAll('br').forEach(br=>br.replaceWith('\n'));el.querySelectorAll('p,ul').forEach(p=>p.insertAdjacentText('beforeend','\n\n'));return el.textContent.replace(/\n{3,}/g,'\n\n').trim();}
function readyIssues(){return [...(!publicBase()?['Add the published website URL.']:[]),...(!settings.postal.trim()?['Add Frontier’s valid postal address.']:[]),...(!validEmail(settings.email)?['Enter a valid sender email.']:[])];}
function recipient(h){return recipientOverrides[h.id]??(h.id==='hawaiian-gardens'?settings.recipientHG.trim():h.email);}
function readiness(){const issues=readyIssues();return issues.length?`<div class="warning">Finish your signature: ${issues.map(esc).join(' ')}</div>`:'<div class="note">Signature ready. Use “Send email” to open your prepared draft.</div>';}
function outreach(){return `<div class="hub">${hubNav()}<main id="main" tabindex="-1">${bulkControls()}${emailCampaignTabs()}<section class="hub-header"><div class="wrap"><div class="eyebrow">Frontier · ${isCompetitionEmail()?'Competition follow-ups':'First emails'}</div><h1>Review it.<br>Send it.</h1><p class="muted">Your recipients, messages, and live website links are together here. Use Send All Emails to open your private sending queue.</p><div class="row spaced"><span class="pill">${HALLS.length} prepared ${isCompetitionEmail()?'follow-ups':'first emails'}</span><span class="pill">Website links connected</span><a class="small" href="https://andrewringlein.github.io/F-marketing/" target="_blank" rel="noopener noreferrer">Open live dashboard</a></div></div></section><div class="wrap email-layout"><aside class="settings"><h2>Your signature</h2><p class="small muted">Preview settings are saved in this browser. Live sending uses the signature configured on the private server.</p><div class="settings-fields"><div><label for="sender">Sender name</label><input id="sender" name="sender" value="${esc(settings.sender)}"><label for="email">Reply/contact email</label><input id="email" name="email" type="email" value="${esc(settings.email)}"></div><div><label for="postal">Business postal address</label><textarea id="postal" name="postal" placeholder="Add your address for the email footer">${esc(settings.postal)}</textarea></div><div><label for="recipientHG">Hawaiian Gardens recipient</label><input id="recipientHG" name="recipientHG" type="email" value="${esc(settings.recipientHG)}" placeholder="Manager’s business email"><p class="small muted">Still unverified. Hall contact: 562-402-6769.</p></div><div><details><summary>Website link settings</summary><label for="base">Published website</label><input id="base" name="base" type="url" value="${esc(settings.base||PUBLISHED_BASE)}"><p class="small muted">All hall links use your GitHub Pages address.</p></details></div></div><button class="button spaced" id="save-settings">Save signature</button><div id="readiness">${readiness()}</div></aside><div>${HALLS.map(h=>`<article class="email-card" id="email-${h.id}"><div class="row" style="justify-content:space-between">${hallCheckbox(h)}<span class="pill">${isCompetitionEmail()?'Follow-up':'Draft'} ${h.letter}</span></div><h2 class="top-gap">${esc(h.short)}</h2><p class="small top-gap" id="recipient-${h.id}"><strong>To:</strong> ${esc(recipient(h)||'Add the manager’s email in the sidebar')}</p><label class="small" for="to-${h.id}">Recipient email</label><input class="contact-input" id="to-${h.id}" type="email" value="${esc(recipient(h)||'')}" onchange="saveRecipient('${h.id}',this.value)"><div class="subject"><strong>Subject:</strong> ${esc(emailSubject(h))}</div><div class="email-preview" id="body-${h.id}">${richEmail(h)}</div><div class="email-actions"><button class="button" data-action="send-email" data-hall="${h.id}">Send email ↗</button><button class="button outline" data-action="copy-rich" data-hall="${h.id}">Copy formatted email</button><button class="button outline" data-action="copy-text" data-hall="${h.id}">Copy plain text</button><button class="button outline" data-action="copy-subject" data-hall="${h.id}">Copy subject</button><button class="button outline" data-action="download-email" data-hall="${h.id}">Download HTML</button></div><p class="small muted top-gap" id="send-status-${h.id}" role="status">Review the message here, then use the private sending queue.</p><div class="row spaced"><a class="text-link" href="${esc(competitionPreview(h.id))}" target="_blank" rel="noopener noreferrer">View competition analysis</a><a class="text-link" href="${esc(pageURL(h.id))}" target="_blank" rel="noopener noreferrer">View live website</a><a class="text-link" href="${esc(pageURL(h.id,true))}" target="_blank" rel="noopener noreferrer">View linked plan</a><details><summary class="small">Recipient source</summary><p class="small">${esc(h.contact)} ${link(h.contactSource,'Source')}</p></details></div><div id="fallback-${h.id}"></div></article>`).join('')}</div></div></main></div>`;}

function hallCheckbox(h){return `<label class="hall-select"><input type="checkbox" data-select-hall="${h.id}" ${emailSelection.has(h.id)?'checked':''} onchange="setHallSelected('${h.id}',this.checked)"><span>Select email ${h.letter}</span></label>`;}
function bulkControls(){return `<div class="wrap bulk-toolbar"><div><button class="button send-all" data-send-all onclick="prepareEmailBatch()" ${emailSelection.size?'':'disabled'}>Send All Emails <span aria-hidden="true">↗</span></button><p class="small muted top-gap"><span data-selection-count>${emailSelection.size} of ${HALLS.length} selected</span> · Private sending queue</p></div><div class="bulk-toggles"><button class="text-button" onclick="selectAllHalls(true)">Select all</button><button class="text-button" onclick="selectAllHalls(false)">Clear selection</button></div></div><dialog id="bulk-email-dialog" class="bulk-dialog" aria-labelledby="bulk-title"><div id="bulk-email-content"></div></dialog>`;}
function setHallSelected(id,checked){if(!HALLS.some(h=>h.id===id))return;if(checked)emailSelection.add(id);else emailSelection.delete(id);updateSelectionUI();}
function selectAllHalls(checked){emailSelection.clear();if(checked)HALLS.forEach(h=>emailSelection.add(h.id));updateSelectionUI();}
function updateSelectionUI(){document.querySelectorAll('[data-select-hall]').forEach(el=>{el.checked=emailSelection.has(el.getAttribute('data-select-hall'));});document.querySelectorAll('[data-selection-count]').forEach(el=>el.textContent=`${emailSelection.size} of ${HALLS.length} selected`);document.querySelectorAll('[data-send-all]').forEach(el=>el.disabled=emailSelection.size===0);}
function selectedEmailPlan(){return HALLS.filter(h=>emailSelection.has(h.id)).map(h=>({id:h.id,issues:[...readyIssues(),...(!validEmail(recipient(h)||'')?['Add the recipient email.']:[])]}));}
function prepareEmailBatch(){if(!emailSelection.size){toast('Select at least one hall.');return;}location.href=liveSendingURL([...emailSelection]);}
function renderEmailBatch(){const ready=emailBatch.filter(item=>!item.issues.length&&!openedBatchDrafts.has(item.id));document.getElementById('bulk-email-content').innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">${emailBatch.length} selected emails</div><h2 id="bulk-title" class="top-gap">Ready to send.</h2></div><button class="button outline" onclick="document.getElementById('bulk-email-dialog').close()" aria-label="Close email list">Close</button></div><p class="muted spaced">Each hall gets its own message and website link. Open each draft, then finish sending in your email app.</p><div class="batch-list spaced">${emailBatch.map(item=>{const h=HALLS.find(h=>h.id===item.id),opened=openedBatchDrafts.has(item.id);return `<div class="batch-row"><div><strong>${esc(h.short)}</strong><p class="small">${esc(recipient(h)||'Recipient email needed')}</p><p class="small muted">${item.issues.length?esc(item.issues.join(' ')):opened?'Draft opened':'Ready'}</p></div>${item.issues.length?`<button class="button outline" onclick="fixBatchDetails('${h.id}')">Add details</button>`:`<button class="button ${opened?'outline':''}" onclick="openBatchDraft('${h.id}')">${opened?'Open again':'Open draft'}</button>`}</div>`;}).join('')}</div><div class="row spaced"><button class="button" onclick="openNextBatchDraft()" ${ready.length?'':'disabled'}>${openedBatchDrafts.size?'Open next email':'Open first email'}</button><span class="small muted">${openedBatchDrafts.size} of ${emailBatch.length} drafts opened</span></div>`;}
function openBatchDraft(id){const item=emailBatch.find(item=>item.id===id);if(!item||item.issues.length)return;sendEmailDraft(HALLS.find(h=>h.id===id));openedBatchDrafts.add(id);renderEmailBatch();}
function openNextBatchDraft(){const next=emailBatch.find(item=>!item.issues.length&&!openedBatchDrafts.has(item.id));if(next)openBatchDraft(next.id);}
function fixBatchDetails(id){document.getElementById('bulk-email-dialog').close();const destination='#/'+(isCompetitionEmail()?'followups':'outreach')+'/'+id;if(location.hash!==destination)location.hash=destination;else document.getElementById(!settings.postal?'postal':'to-'+id)?.focus();}

async function copyText(text){await navigator.clipboard.writeText(text);}
function download(name,type,content){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',async event=>{
 const button=event.target.closest('[data-action]');if(!button)return;
 const h=HALLS.find(h=>h.id===button.dataset.hall);if(!h)return;
 const action=button.dataset.action;
 if(action==='send-email'){sendEmailDraft(h);return;}
 if(action==='copy-link'){const url=pageURL(h.id);if(!url){toast('Add the published URL in the email workshop first.');return;}try{await copyText(url);toast('Website link copied.');}catch{toast(url);}return;}
 if(action==='copy-subject'){try{await copyText(emailSubject(h));toast('Subject copied.');}catch{toast('Select the subject text above and copy it.');}return;}
 const issues=readyIssues();if(issues.length){toast(issues.join(' '));document.getElementById('readiness')?.scrollIntoView({block:'center'});return;}
 try{
  if(action==='copy-rich'){
   if(!window.ClipboardItem||!navigator.clipboard?.write)throw new Error('Rich clipboard unavailable');
   await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([richEmail(h)],{type:'text/html'}),'text/plain':new Blob([plainEmail(h)],{type:'text/plain'})})]);toast('Formatted email copied. Paste into your email composer.');
  }else if(action==='copy-text'){await copyText(plainEmail(h));toast('Plain-text email copied, including full links.');}
  else if(action==='download-email'){download(`${h.id}-${isCompetitionEmail()?'competition-followup':'email'}.html`,'text/html;charset=utf-8',`<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(emailSubject(h))}</title><body>${richEmail(h)}</body></html>`);toast('HTML email downloaded. Open it and copy the formatted body.');}
 }catch{
  const fallback=document.getElementById(`fallback-${h.id}`);fallback.innerHTML='<p class="small spaced">Clipboard access is unavailable. Select and copy the formatted preview above, or use this plain-text fallback:</p><textarea class="export-fallback" aria-label="Email text to copy"></textarea>';const area=fallback.querySelector('textarea');area.value=plainEmail(h);area.focus();area.select();toast('Use Ctrl+C (or Command+C) to copy the selected text.');
 }
});
function deployment(){return `<div class="hub">${hubNav()}<main id="main" class="wrap narrow section guide" tabindex="-1"><div class="eyebrow">GitHub Pages · Share links</div><h1 class="spaced">One dashboard.<br>Every hall linked.</h1><p class="spaced">These published links are included in your prepared emails. Each hall has its own website, plan and competition pages.</p><p class="spaced"><a class="button" href="#/outreach">Open email outbox</a><a class="button outline" href="${esc(PUBLISHED_BASE)}" target="_blank" rel="noopener noreferrer">Open live dashboard</a></p><div class="link-list spaced">${HALLS.map(h=>`<article class="card"><h3>${esc(h.short)}</h3><p><a href="${esc(pageURL(h.id))}" target="_blank" rel="noopener noreferrer">${esc(pageURL(h.id))}</a></p><p><a href="${esc(pageURL(h.id,true))}" target="_blank" rel="noopener noreferrer">Open the linked improvement plan</a></p><p><a href="${esc(competitionURL(h.id))}" target="_blank" rel="noopener noreferrer">Open competition map</a> · <a href="${esc(competitionURL(h.id,true))}" target="_blank" rel="noopener noreferrer">Hall-by-hall comparison</a></p><button class="button outline spaced" data-action="copy-link" data-hall="${h.id}">Copy website link</button></article>`).join('')}</div><details class="spaced"><summary>Updating the GitHub version</summary><p>Upload updated files to the same paths in <a href="https://github.com/AndrewRinglein/F-marketing" target="_blank" rel="noopener noreferrer">AndrewRinglein/F-marketing</a>. GitHub Pages will republish from the configured branch. Email and dashboard changes are in the root <code>index.html</code>; hall websites and plans are in their respective folders.</p></details><p class="small muted spaced">Send All Emails opens the private sending console. Copy formatted email remains available.</p></main></div>`;}


// Enrich the landing page into the requested prospect dashboard.

function hub(){return `<div class="hub">${hubNav()}<main id="main" tabindex="-1">${bulkControls()}<section class="hub-header"><div class="wrap"><div class="eyebrow">Frontier Gaming Systems · Outreach dashboard</div><h1>Here’s the pitch.<br><span class="serif">Here’s their new website.</span></h1><p class="muted">${HALLS.length} first emails and ${HALLS.length} competition follow-ups, with a website, growth plan and local competition map for every hall. Review each message, select your halls, and open the private sending queue. Each email includes its own GitHub Pages website link.</p><div class="row spaced"><a class="button" href="#/outreach">Open email outbox</a><a class="button outline" href="#/followups">Follow-up emails · Competition</a><a class="button outline" href="#/deploy">Live website links</a></div><div class="delivery-strip"><div><strong>01 · Email</strong><span class="small muted">Personal opening, practical suggestions, one clear next step.</span></div><div><strong>02 · Website</strong><span class="small muted">Presales, hot ball, must-go, text signup, and loyalty demos.</span></div><div><strong>03 · Deeper plan</strong><span class="small muted">Research, implementation steps, and measurable pilots.</span></div><div><strong>04 · Conversation</strong><span class="small muted">A short workflow review with Frontier.</span></div></div></div></section><section class="section"><div class="wrap"><div class="prospect-search"><label for="hall-search" class="small">Find a hall</label><input id="hall-search" type="search" placeholder="Hall, city, or charity" oninput="filterProspects()"><select id="hall-region" aria-label="Filter by region" onchange="filterProspects()"><option value="">All California</option>${[...new Set(HALLS.map(h=>h.extra?.region||'Southern California'))].map(region=>`<option>${esc(region)}</option>`).join('')}</select><span class="small muted" id="hall-result-count">${HALLS.length} halls shown</span></div><div class="grid">${HALLS.map(h=>`<article class="prospect-card" data-prospect="${h.id}"><div class="card-selection">${hallCheckbox(h)}</div><a class="preview-tile ${h.color}" href="#/${h.id}" style="text-decoration:none;${h.extra?'--tile-accent:'+h.extra.design.accent:''}"><span class="eyebrow">${esc(h.location)}</span><h2 ${h.color==='hg'?'class="serif"':''}>${h.tile}</h2><span class="small">Open the interactive website</span></a><div class="prospect-inner"><div class="eyebrow">Email ${h.letter} · ${esc(h.angle)}</div><p><strong>${esc(h.name)}</strong></p>${featureBadges(h)}<p class="small"><strong>To:</strong> ${esc(recipient(h)||'Recipient email still needed')}<br>${esc(h.recipient)}</p><div class="send-subject">${esc(h.subject)}</div><div class="stack spaced"><a class="text-link" href="#/outreach/${h.id}">Review the message</a><a class="text-link" href="#/followups/${h.id}">Review the competition follow-up</a><a class="text-link" href="${esc(competitionPreview(h.id))}">See their competition</a><a class="button outline" href="#/${h.id}">Try their website</a><div class="row"><a class="text-link" href="#/${h.id}/plan">Read their plan</a><button class="button outline" data-action="copy-link" data-hall="${h.id}">Copy site link</button></div></div><details class="spaced"><summary>Hall research & contact evidence</summary><p class="small">${esc(h.size)} ${link(h.sizeSource,'Scale source')}</p><p class="small">${esc(h.contact)} ${link(h.contactSource,'Contact source')}</p>${h.id==='hawaiian-gardens'?`<p class="small">Call 562-402-6769 for the manager’s business email, or use the ${link('https://www.irvingimoskowitzfoundation.org/contact-irving-moskowitz.php','foundation contact form')}.</p>`:''}<p class="small">${link(h.source,'Existing bingo website')}</p>${h.extra?.claimNotes?`<p class="small"><strong>Revenue figure source:</strong> ${esc(h.extra.claimNotes)}</p>`:''}</details></div></article>`).join('')}</div><div class="note spaced"><strong>First recommendations:</strong> visible opt-in text collection, loyalty, and presales. Bosco already has presales; its pitch improves that path. Hot-ball and must-go boards show how a real game program can become easier to discover.</div><div class="two spaced"><div class="card"><h3>What recipients will try</h3><p>Choose a session and package, review a presale, try text signup, and enroll in a loyalty program. Hawaiian Gardens features a $35,000 must-go; Bosco features a $5,000 hot ball. McAlister leads with presales and rewards. Bosco also links to its real BingoMeNow provider.</p></div><div class="card"><h3>Before sending</h3><p>Connect your sending account and signature in the private sending setup, then verify the recipient addresses. Hawaiian Gardens still needs a contact email. The linked websites and competition pages are published.</p></div></div><details class="spaced"><summary>Research scope and the presale result</summary><p>These California prospects include dedicated halls and recurring charitable bingo programs. This is not a size ranking. Historic size figures are dated in the evidence. Findings describe the pages reviewed, not every internal process. Research date: September 10, 2026.</p><p>Frontier supplied the 42% attendance increase over six months from its own presales experience. That result appears in the Hawaiian Gardens and McAlister emails.</p></details></div></section></main><footer class="footer rule"><div class="wrap row"><span>Frontier Gaming Systems · Bingo outreach</span><a href="https://frontiergamingsystems.com/" target="_blank" rel="noopener noreferrer">Frontier Gaming Systems</a></div></footer></div>`;}

const baseRender=render;
render=function(){baseRender();if(FOLDER_EDITION)app.querySelectorAll('a[href^="#/"]').forEach(a=>{const [id,section]=a.getAttribute('href').slice(2).split('/');if(HALLS.some(h=>h.id===id))a.setAttribute('href',`${id}/${section==='plan'?'plan':'index'}.html${section&&section!=='plan'?'#'+section:''}`);});const parts=location.hash.replace(/^#\/?/,'').split('/');if((parts[0]==='outreach'||parts[0]==='followups')&&parts[1])document.getElementById(`email-${parts[1]}`)?.scrollIntoView();};
window.removeEventListener('hashchange',baseRender);
window.addEventListener('hashchange',render);
render();
</script>
